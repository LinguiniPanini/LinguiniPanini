<svg width="100%" height="195" viewBox="0 0 850 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="850" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="850" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box with Border -->
  <rect x="1" y="1" width="848" height="193" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Ambient Glows -->
  <circle cx="760" cy="35" r="95" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="90" cy="155" r="85" fill="#0284c7" opacity="0.10" filter="url(#glow)" />

  <!-- Subtle Decorative Grid Lines -->
  <path d="M580 0 L850 195" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
  <path d="M660 0 L850 140" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
  <path d="M500 0 L760 195" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.15" />

  <!-- Top Status Badge: Open to Opportunities -->
  <g transform="translate(45, 24)">
    <rect width="190" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="#10b981" />
    <text x="105" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Main Name Title -->
  <text x="45" y="86" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.5">
    Luis Alberto González Escamilla
  </text>

  <!-- Subtitle with Gradient -->
  <text x="45" y="118" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">
    Computer Systems Engineer | AI &amp; Agent Engineer
  </text>

  <!-- Key Competencies Pills (Properly measured and centered) -->
  <g transform="translate(45, 142)">
    <!-- Pill 1: AWS (EKS · Lambda · S3) -> width 195 -->
    <rect x="0" y="0" width="195" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="97.5" y="17.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">AWS (EKS · Lambda · S3)</text>

    <!-- Pill 2: Terraform (IaC) -> width 135 -->
    <rect x="205" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="272.5" y="17.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Terraform (IaC)</text>

    <!-- Pill 3: AI Agents & Tracing -> width 165 -->
    <rect x="350" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="432.5" y="17.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">AI Agents &amp; Tracing</text>

    <!-- Pill 4: Event-Driven (SQS) -> width 155 -->
    <rect x="525" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="602.5" y="17.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Event-Driven (SQS)</text>
  </g>
</svg>
