<svg width="100%" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="850" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="850" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box with Border -->
  <rect x="1" y="1" width="848" height="178" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Subtle Ambient Glow -->
  <circle cx="760" cy="30" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="90" cy="150" r="80" fill="#0284c7" opacity="0.10" filter="url(#glow)" />

  <!-- Grid Decoration Lines -->
  <path d="M600 0 L850 180" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
  <path d="M680 0 L850 120" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
  <path d="M520 0 L770 180" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />

  <!-- Top Status Badge -->
  <g transform="translate(45, 26)">
    <rect width="168" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="11" r="4" fill="#10b981" />
    <text x="24" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Main Name Title -->
  <text x="45" y="86" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    Luis Alberto González Escamilla
  </text>

  <!-- Subtitle with Gradient -->
  <text x="45" y="116" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2">
    Software &amp; Systems Engineer · Cloud Infrastructure (AWS) &amp; AI Automation
  </text>

  <!-- Key Competencies Pills -->
  <g transform="translate(45, 136)">
    <!-- Pill 1: AWS & EKS -->
    <rect x="0" y="0" width="138" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">☁️ AWS (EKS · Lambda · S3)</text>

    <!-- Pill 2: Terraform & IaC -->
    <rect x="146" y="0" width="120" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="156" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">⚡ Terraform (IaC)</text>

    <!-- Pill 3: AI Agents & Reliability -->
    <rect x="274" y="0" width="144" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="284" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🤖 AI Agents &amp; Tracing</text>

    <!-- Pill 4: Event-Driven -->
    <rect x="426" y="0" width="140" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="436" y="16" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">📬 Event-Driven (SQS)</text>
  </g>
</svg>
